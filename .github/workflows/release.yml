name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: "6.10.0"
          arch: win64_msvc2022_64
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.0"

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must match vMAJOR.MINOR.PATCH"
          }


      - name: Configure
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCPACK_PACKAGE_VERSION=$version `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCPACK_WIX_ROOT="$env:WIX"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create CPack packages
        working-directory: build
        run: |
          cpack --verbose --config CPackConfig.cmake -C Release -G WIX
          cpack --config CPackConfig.cmake -C Release -G ZIP
          if (-not (Get-ChildItem -Filter *.msi -File)) {
            throw "CPack WIX completed without producing an MSI"
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpellChessArena-windows
          path: |
            build/*.msi
            build/*.zip
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: "6.10.0"
          arch: linux_gcc_64
          cache: true
          setup-python: false
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.0"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Configure
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_PACKAGE_VERSION="$version" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create CPack package
        working-directory: build
        run: cpack --config CPackConfig.cmake -C Release -G TGZ

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpellChessArena-linux
          path: build/*.tar.gz
          if-no-files-found: error

  publish-release:
    needs:
      - package-windows
      - package-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SpellChessArena-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.msi
            release-assets/*.zip
            release-assets/*.tar.gz